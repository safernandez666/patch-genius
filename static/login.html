<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — Patch Genius</title>
<link rel="icon" type="image/svg+xml" href="/static/assets/genie.svg">
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/tailwind.css">
<link rel="stylesheet" href="/static/auth.css">
<script src="/static/theme-preload.js"></script>
<script src="/static/theme.js"></script>
</head>
<body>
<div class="auth">
  <div class="auth-form-col">
    <div class="auth-box">
      <div class="auth-mark">
        <img src="/static/assets/genie.svg" alt="">
        <span>Patch <b>Genius</b></span>
      </div>
      <h1 data-i18n="login.title">Sign in</h1>
      <p class="sub" data-i18n="login.sub">Sign in to your account to see the vulnerability inventory.</p>
      <form id="f" novalidate>
        <label for="u" data-i18n="login.user">Username</label>
        <input id="u" type="text" autocomplete="username" required autofocus>
        <label for="p" data-i18n="login.pass">Password</label>
        <input id="p" type="password" autocomplete="current-password" required>
        <button id="b" type="submit" data-i18n="login.submit">Sign in</button>
        <div class="msg" id="e" role="alert" aria-live="polite"></div>
      </form>
    </div>
  </div>
  <div class="auth-brand">
    <div class="glow"></div>
    <div class="auth-brand-inner">
      <img src="/static/assets/genie.svg" alt="">
      <h2>Patch <b>Genius</b></h2>
      <p data-i18n="brand.tagline">Vulnerability and patch tracking on top of your own Wazuh.
        Prioritised with CISA KEV and EPSS.</p>
    </div>
  </div>
</div>
<script src="/static/i18n.js"></script>
<script>
document.getElementById('f').addEventListener('submit', async function (ev) {
  ev.preventDefault();
  var b = document.getElementById('b'), e = document.getElementById('e');
  b.disabled = true; e.className = 'msg'; e.textContent = '';
  try {
    var r = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: document.getElementById('u').value,
                            password: document.getElementById('p').value})
    });
    if (r.ok) { window.location = '/'; return; }
    e.className = 'msg err';
    e.textContent = t('login.bad', 'Wrong username or password.');
  } catch (err) {
    e.className = 'msg err';
    e.textContent = t('login.down', 'Could not reach the server.');
  }
  b.disabled = false;
});
</script>
</body>
</html>
