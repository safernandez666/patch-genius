<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ingresar — Patch Genius</title>
<link rel="icon" type="image/svg+xml" href="/static/assets/genie.svg">
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/tailwind.css">
<link rel="stylesheet" href="/static/auth.css">
</head>
<body>
<div class="auth">
  <div class="auth-form-col">
    <div class="auth-box">
      <div class="auth-mark">
        <img src="/static/assets/genie.svg" alt="">
        <span>Patch <b>Genius</b></span>
      </div>
      <h1 data-i18n="login.title">Ingresar</h1>
      <p class="sub" data-i18n="login.sub">Entrá con tu cuenta para ver el inventario de vulnerabilidades.</p>
      <form id="f" novalidate>
        <label for="u" data-i18n="login.user">Usuario</label>
        <input id="u" type="text" autocomplete="username" required autofocus>
        <label for="p" data-i18n="login.pass">Contraseña</label>
        <input id="p" type="password" autocomplete="current-password" required>
        <button id="b" type="submit" data-i18n="login.submit">Ingresar</button>
        <div class="msg" id="e" role="alert" aria-live="polite"></div>
      </form>
    </div>
  </div>
  <div class="auth-brand">
    <div class="glow"></div>
    <div class="auth-brand-inner">
      <img src="/static/assets/genie.svg" alt="">
      <h2>Patch <b>Genius</b></h2>
      <p data-i18n="brand.tagline">Seguimiento de vulnerabilidades y parcheo sobre tu propio Wazuh.
        Priorizado con CISA KEV y EPSS.</p>
    </div>
  </div>
</div>
<script src="/static/i18n.js"></script>
<script>
document.getElementById('f').addEventListener('submit', async function (ev) {
  ev.preventDefault();
  var b = document.getElementById('b'), e = document.getElementById('e');
  b.disabled = true; e.className = 'msg'; e.textContent = '';
  try {
    var r = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: document.getElementById('u').value,
                            password: document.getElementById('p').value})
    });
    if (r.ok) { window.location = '/'; return; }
    e.className = 'msg err';
    e.textContent = t('login.bad', 'Usuario o contraseña incorrectos.');
  } catch (err) {
    e.className = 'msg err';
    e.textContent = t('login.down', 'No se pudo contactar al servidor.');
  }
  b.disabled = false;
});
</script>
</body>
</html>
