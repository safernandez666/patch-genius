services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vulndemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulndemo}
      POSTGRES_DB: ${POSTGRES_DB:-vulndemo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vulndemo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sin publicar al host: la API le llega por la red interna del compose;
    # publicarlo no hace falta y puede chocar con un Postgres que ya corra
    # en el mismo servidor.

  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-vulndemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulndemo}
      POSTGRES_DB: ${POSTGRES_DB:-vulndemo}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback by default: the VPS deploy puts nginx in front and nothing else
      # should reach uvicorn directly. Set APP_BIND=0.0.0.0 in .env to publish on
      # every interface so other hosts on the LAN can open the panel.
      - "${APP_BIND:-127.0.0.1}:8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
